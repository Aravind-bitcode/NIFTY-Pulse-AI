<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="100%" stop-color="#0b1329"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" stroke="#10b981" stroke-width="12"/>

  <!-- Grid Lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="80" y1="256" x2="432" y2="256" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>
  <line x1="80" y1="152" x2="432" y2="152" stroke="#1e293b" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Letter 'A' & Stock Bull Surge Line -->
  <path d="M 130 390 L 256 110" stroke="url(#cyanGlow)" stroke-width="42" stroke-linecap="round" filter="url(#neon)"/>
  <path d="M 256 110 L 382 390" stroke="url(#cyanGlow)" stroke-width="42" stroke-linecap="round" filter="url(#neon)"/>
  <path d="M 175 285 L 337 285" stroke="#10b981" stroke-width="30" stroke-linecap="round" filter="url(#neon)"/>

  <!-- Apex Stock Surge Node -->
  <circle cx="256" cy="110" r="26" fill="#10b981" filter="url(#neon)"/>
  <circle cx="256" cy="110" r="12" fill="#ffffff"/>
  
  <circle cx="175" cy="285" r="18" fill="#06b6d4"/>
  <circle cx="337" cy="285" r="18" fill="#06b6d4"/>
</svg>
